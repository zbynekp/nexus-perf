services:
  nexus:
    # Pin to a specific version for reproducibility.
    # Check https://hub.docker.com/r/sonatype/nexus3/tags for the latest stable.
    image: sonatype/nexus3:3.72.0
    container_name: nexus-test
    ports:
      - "8081:8081"
    volumes:
      - nexus-data:/nexus-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/service/rest/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - nexus-network

  nexus-perf-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-perf-test
    depends_on:
      nexus:
        condition: service_healthy
    environment:
      # Endpoint must match the Nexus service name and port — no NEXUS_CONTEXT suffix.
      - NEXUS_PERF_NEXUS_ENDPOINT=http://nexus:8081
      - NEXUS_PERF_USERNAME=admin
      # Override with: docker compose run -e NEXUS_PERF_PASSWORD=... nexus-perf-test
      - NEXUS_PERF_PASSWORD=${NEXUS_PERF_PASSWORD:-admin123}
      - NEXUS_PERF_REPOSITORY_NAME=maven-releases
      - NEXUS_PERF_FORMAT=MAVEN
      - NEXUS_PERF_NUM_FILES=50
      - NEXUS_PERF_NUM_THREADS=8
      - NEXUS_PERF_FILE_SIZE=1000000
      - NEXUS_PERF_VERBOSITY=2
    networks:
      - nexus-network
    command: test

volumes:
  nexus-data:
    driver: local

networks:
  nexus-network:
    driver: bridge
